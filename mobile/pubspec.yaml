name: connect4all
description: Connect4All is a rural internet coverage mapping app for Laos.
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  dio: ^5.4.3+1

  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.2.3

  flutter_map: ^7.0.2
  # Caches OSM tiles to disk (FMTC store) so the coverage map — the thing
  # the app maps dead zones with — still renders once it's out of signal.
  flutter_map_tile_caching: ^9.1.3
  latlong2: ^0.9.1

  geolocator: ^12.0.0
  permission_handler: ^11.3.1
  connectivity_plus: ^6.0.3
  device_info_plus: ^10.1.0

  # 0.5.2 depends on the legacy Flutter v1-embedding shim, which recent
  # Flutter SDKs (this repo verified against 3.44.9) have removed entirely —
  # its Android plugin fails to compile. 0.10+ dropped that shim.
  workmanager: ^0.10.7

  intl: ^0.20.2
  uuid: ^4.4.0
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.9
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
