services:
  - type: web
    name: connect4all-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 30d
      - key: CORS_ORIGIN
        value: "*"
      - key: AGGREGATION_CRON
        value: "*/15 * * * *"
      - key: PREDICTION_CRON
        value: "0 3 * * *"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: deepseek/deepseek-r1
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1

  # Operator/admin web app.
  - type: web
    name: connect4all-dashboard
    runtime: static
    rootDir: dashboard
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://connect4all-backend.onrender.com
    routes:
      # SPA: let react-router handle every path client-side.
      - type: rewrite
        source: /*
        destination: /index.html

  # Public site for residents/travellers.
  - type: web
    name: connect4all-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://connect4all-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
